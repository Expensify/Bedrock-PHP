name: Create new version

# Runs when a pull request is merged into main. It tags the merge commit with
# the next patch version and comments the released version on the pull request.
on:
  push:
    branches: [main]

# Serialize runs so two quick merges cannot race to the same version number.
concurrency: version

permissions:
  contents: write
  pull-requests: write

jobs:
  version:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10

    steps:
    - name: checkout
      # v4.1.0
      uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608
      with:
        # The next version is derived from the tags, so fetch all of them.
        fetch-depth: 0
        fetch-tags: true

    - name: Get next version
      run: |
        set -euo pipefail
        LATEST_VERSION="$(git tag --list --sort=-v:refname | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)"
        if [ -z "$LATEST_VERSION" ]; then
          echo "Found no version tag to increment."
          exit 1
        fi
        MAJOR="${LATEST_VERSION%%.*}"
        MINOR="${LATEST_VERSION#*.}"
        MINOR="${MINOR%%.*}"
        PATCH="${LATEST_VERSION##*.}"
        echo "Latest version: $LATEST_VERSION"
        echo "NEW_VERSION=$MAJOR.$MINOR.$((10#$PATCH + 1))" >> "$GITHUB_ENV"

    - name: Tag new version
      run: |
        set -euo pipefail
        echo "Tagging ${{ github.sha }} as ${{ env.NEW_VERSION }}"
        gh api --method POST "repos/${{ github.repository }}/git/refs" \
          --field ref="refs/tags/${{ env.NEW_VERSION }}" \
          --field sha="${{ github.sha }}"
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Comment in PR with new version
      run: |
        set -euo pipefail
        PR_URL="$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" --jq '.[0].html_url')"
        if [ -z "$PR_URL" ]; then
          echo "Found no pull request for ${{ github.sha }}, so there is nobody to notify."
          exit 0
        fi
        gh pr comment "$PR_URL" --body "🚀 Released in version ${{ env.NEW_VERSION }} 🚀"
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
